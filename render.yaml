services:
  - type: web
    name: echoes-of-smasc-26
    runtime: python
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && python manage.py collectstatic --noinput --clear"
    startCommand: "python manage.py migrate --noinput && python manage.py seed_initial_data && gunicorn config.wsgi:application -c gunicorn.conf.py"
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.13.1
    disk:
      name: media-disk
      mountPath: /opt/render/project/src/media
      sizeGB: 10

