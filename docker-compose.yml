services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pgallery_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - media_volume:/app/media
      - static_volume:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  db:
    image: postgres:16-alpine
    container_name: pgallery_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pgallery}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-pgallery}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  media_volume:
    name: pgallery_media_volume
  static_volume:
    name: pgallery_static_volume
  postgres_data:
    name: pgallery_postgres_data

